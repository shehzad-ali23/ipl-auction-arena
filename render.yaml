services:
  - type: web
    name: ipl-auction-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: ipl-auction-db
          property: connectionString
databases:
  - name: ipl-auction-db
    plan: free
    databaseName: ipl_auction
    user: ipl_auction
